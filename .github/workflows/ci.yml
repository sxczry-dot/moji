name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 + 编译验证
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（使用 runner 预装 SDK）
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 设置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 运行单元测试（解析器回归）
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: 展示测试报告
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'app/build/test-results/testDebugUnitTest/*.xml'
          fail_on_failure: true

      - name: 编译 Debug APK（整体编译验证）
        run: ./gradlew assembleDebug

      - name: 静态检查（只拦新增问题）
        run: ./gradlew lintDebug

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: 上传 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
